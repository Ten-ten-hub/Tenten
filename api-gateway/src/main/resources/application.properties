spring.config.import=optional:file:./application-common.properties,optional:file:./application-secret.properties

# ----------------------------------------
# Application
# ----------------------------------------
server.port=8000
spring.application.name=api-gateway

# ----------------------------------------
# Gateway Routes
# ----------------------------------------

# sample
spring.cloud.gateway.routes[0].id=sample-service
spring.cloud.gateway.routes[0].uri=lb://sample-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/main/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/main/(?<path>.*), /api/v1/main/$\{path}

# company
spring.cloud.gateway.routes[1].id=company-service
spring.cloud.gateway.routes[1].uri=lb://company-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/companies/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/companies/(?<path>.*), /api/v1/companies/$\{path}

# delivery
spring.cloud.gateway.routes[2].id=delivery-service
spring.cloud.gateway.routes[2].uri=lb://delivery-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/deliveries/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/deliveries/(?<path>.*), /api/v1/deliveries/$\{path}

# notification
spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://notification-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/notifications/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/notifications/(?<path>.*), /api/v1/notifications/$\{path}

# auth
spring.cloud.gateway.routes[4].id=auth-service
spring.cloud.gateway.routes[4].uri=lb://auth-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/auth/(?<path>.*), /api/v1/auth/$\{path}

# user
spring.cloud.gateway.routes[5].id=user-service
spring.cloud.gateway.routes[5].uri=lb://user-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/users/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/users/(?<path>.*), /api/v1/users/$\{path}

# hub
spring.cloud.gateway.routes[6].id=hub-server
spring.cloud.gateway.routes[6].uri=lb://hub-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/hubs/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/hubs/(?<path>.*), /api/v1/hubs/$\{path}

# product
spring.cloud.gateway.routes[7].id=product-service
spring.cloud.gateway.routes[7].uri=lb://product-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/products/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/products/(?<path>.*), /api/v1/products/$\{path}

# ----------------------------------------
# Eureka
# ----------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
eureka.client.registry-fetch-interval-seconds=5

# ----------------------------------------
# Logging
# ----------------------------------------
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.web=DEBUG

# ----------------------------------------
# JWT ???
# ----------------------------------------
jwt.secret=${JWT_SECRET:test-secret-key-test-secret-key-test-secret-key}
jwt.access-token-validity=${JWT_ACCESS_TOKEN_VALIDITY:1h}
jwt.refresh-token-validity=${JWT_REFRESH_TOKEN_VALIDITY:7d}
