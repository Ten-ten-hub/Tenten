server:
  port: 8000

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: sample-service
          uri: lb://sample-service
          predicates:
            - Path=/main/**

        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/companies/**

        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/deliveries/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka