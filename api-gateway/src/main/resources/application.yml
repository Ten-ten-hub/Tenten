server:
  port: 8000

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: sample-service
          uri: lb://sample-service
          predicates:
            - Path=/main/**

        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/companies/**

        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/deliveries/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
          filters:
            - RewritePath=/notifications/(?<path>.*), /api/v1/notifications/${path}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    registry-fetch-interval-seconds: 5

logging:
  level:
    org.springframework.cloud.gateway.server.mvc: TRACE
    org.springframework.web.servlet.handler: DEBUG