spring.config.import=optional:file:${user.dir}/application-common.properties,optional:file:${user.dir}/application-secret.properties
server.port=8090
spring.application.name=hub-service
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${HUB_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
jwt.secret=${JWT_SECRET}
tmap.base-url=https://apis.openapi.sk.com
tmap.app-key=${TMAP_APP_KEY}
tmap.use-truck-routes=false
tmap.request-delay-ms=0
management.health.redis.enabled=false
management.tracing.enabled=true
management.zipkin.tracing.export.enabled=true
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT}
management.endpoints.web.exposure.include=health,info,flyway
