spring.config.import=optional:file:${user.dir}/application-common.properties,optional:file:${user.dir}/application-secret.properties,optional:file:${user.dir}/../application-common.properties,optional:file:${user.dir}/../application-secret.properties
spring.application.name=company-service
server.port=8081
spring.docker.compose.enabled=false
# user-service ?? ??? Feign ??
client.user-service.name=user-service
client.user-service.url=${USER_SERVICE_URL:http://localhost:8087}
# hub-service ?? ??? Feign ??
client.hub-service.name=hub-service
client.hub-service.url=${HUB_SERVICE_URL:http://localhost:8090}
# DB ??
spring.datasource.url=${COMPANY_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA ??
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Flyway ??
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Eureka ??
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# actuator / tracing
management.endpoints.web.exposure.include=health,info,flyway
management.tracing.enabled=true
management.zipkin.tracing.export.enabled=true
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT}
# ??
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG

