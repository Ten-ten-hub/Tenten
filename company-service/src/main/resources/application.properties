spring.application.name=company-service
server.port=8081

spring.docker.compose.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5432/tenten_company
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

client.hub-service.name=hub-service
client.hub-service.url=http://localhost:8082

management.endpoints.web.exposure.include=health,info,flyway

# Zipkin ??? ?
management.tracing.export.enabled=false

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG