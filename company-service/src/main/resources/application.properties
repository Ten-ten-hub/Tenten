spring.config.import=optional:file:./application-common.properties,optional:file:./application-secret.properties

spring.application.name=company-service
server.port=8081

spring.docker.compose.enabled=false

spring.datasource.url=${COMPANY_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

client.hub-service.name=hub-service
client.hub-service.url=http://localhost:8090

management.endpoints.web.exposure.include=health,info,flyway
management.tracing.enabled=false
management.zipkin.tracing.export.enabled=false

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
