spring.application.name=delivery-service
server.port=8082

# Docker Compose ?? ?? ????
# ???? ?? DB/Eureka? ??? ?? false? ??
spring.docker.compose.enabled=false

# ----------------------------------------
# DataSource ??
# ----------------------------------------
# delivery ???? ??? PostgreSQL DB ?? ??
spring.datasource.url=jdbc:postgresql://localhost:5432/tenten_delivery
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------
# JPA / Hibernate ??
# ----------------------------------------
# ???? ??? ??? ?????? ??
# ??? ??/??? Flyway? ??
spring.jpa.hibernate.ddl-auto=validate

# ???? SQL ?? ??
spring.jpa.show-sql=true

# SQL ??? ?? ?? ???
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------
# Flyway ??
# ----------------------------------------
# Flyway ?????? ??
spring.flyway.enabled=true

# ?? DB?? baseline? ?? ?????? ????? ??
spring.flyway.baseline-on-migrate=true

# ?????? ?? ??
spring.flyway.locations=classpath:db/migration

# ----------------------------------------
# Eureka ??
# ----------------------------------------
# Eureka ?? ??
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ----------------------------------------
# Actuator / Tracing ??
# ----------------------------------------
# tracing export ????
# Zipkin ??? ?? ? ConnectException ?? ??
management.tracing.export.enabled=false

# ??? ??? actuator ?????
management.endpoints.web.exposure.include=health,info,flyway