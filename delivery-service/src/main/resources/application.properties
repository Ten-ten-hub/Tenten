spring.config.import=optional:file:${user.dir}/application-secret.properties

spring.application.name=delivery-service
server.port=8082

spring.docker.compose.enabled=false

spring.datasource.url=${DELIVERY_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}

management.tracing.enabled=false
management.endpoints.web.exposure.include=health,info,flyway
