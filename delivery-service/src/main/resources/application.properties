# ----------------------------------------
# Application
# ----------------------------------------
spring.application.name=delivery-service
server.port=8082

# Disable automatic Docker Compose support.
# This prevents Spring Boot from trying to manage Docker services at startup.
spring.docker.compose.enabled=false

# ----------------------------------------
# DataSource
# ----------------------------------------
# PostgreSQL database for delivery-service
spring.datasource.url=jdbc:postgresql://localhost:5432/tenten_delivery
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------
# JPA / Hibernate
# ----------------------------------------
# Validate entity schema against the database.
# Do not create or update tables automatically.
spring.jpa.hibernate.ddl-auto=validate

# Show SQL in console
spring.jpa.show-sql=true

# Pretty format SQL logs
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------
# Flyway
# ----------------------------------------
# Enable Flyway migration
spring.flyway.enabled=true

# Use baseline when the database already exists
spring.flyway.baseline-on-migrate=true

# Migration script location
spring.flyway.locations=classpath:db/migration

# ----------------------------------------
# Eureka
# ----------------------------------------
# Eureka server address
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ----------------------------------------
# Actuator / Tracing
# ----------------------------------------
# Disable tracing export.
# This prevents Zipkin connection errors when Zipkin server is not running.
management.tracing.enabled=false

# Expose only required actuator endpoints
management.endpoints.web.exposure.include=health,info,flyway
