server:
  port: 0

spring:
  application:
    name: sample-service

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/sample_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka