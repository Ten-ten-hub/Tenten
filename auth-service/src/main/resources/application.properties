# 루트(tenten) 경로와 각 서비스 실행 경로 모두에서 공통/시크릿 설정 파일을 읽을 수 있도록 import
spring.config.import=optional:file:${user.dir}/application-common.properties,optional:file:${user.dir}/application-secret.properties,optional:file:${user.dir}/../application-common.properties,optional:file:${user.dir}/../application-secret.properties

server.port=8086
spring.application.name=auth-service

spring.docker.compose.enabled=false

# auth-service는 Redis만 사용하고, DB는 사용하지 않으므로 JDBC/JPA/Flyway 자동 설정 제외
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Redis 연결 정보
spring.data.redis.host=${AUTH_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${AUTH_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${AUTH_REDIS_PASSWORD:${REDIS_PASSWORD:}}

# Eureka 서버 연결 정보
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=auth-service
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# JWT 설정
jwt.secret=${JWT_SECRET:test-secret-key-test-secret-key-test-secret-key}
jwt.access-token-validity=${JWT_ACCESS_TOKEN_VALIDITY:1h}
jwt.refresh-token-validity=${JWT_REFRESH_TOKEN_VALIDITY:7d}

spring.main.allow-bean-definition-overriding=true
